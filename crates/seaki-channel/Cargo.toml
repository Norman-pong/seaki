[package]
name = "seaki-channel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Channel integration and outbound message queue for Seaki"
repository = "https://github.com/normanpong/seaki"
readme = "../../README.md"
keywords = ["seaki", "wiki", "local-first"]
categories = ["development-tools"]

[lib]
path = "src/lib.rs"

[dependencies]
seaki-core = { path = "../seaki-core" }
seaki-dto = { path = "../seaki-dto" }
seaki-policy = { path = "../seaki-policy" }
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
reqwest = { version = "0.12", features = ["json"] }
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
tracing = "0.1"
uuid = { version = "1.8", features = ["v7"] }
wasmtime = { version = "29.0", default-features = false, features = ["cranelift", "runtime", "wat"] }

[dev-dependencies]
tempfile.workspace = true
