[package]
name = "seaki-dto-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TypeScript DTO generator from Rust schemas"
repository = "https://github.com/normanpong/seaki"
readme = "../../README.md"
keywords = ["seaki", "wiki", "local-first"]
categories = ["development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "seaki-dto-codegen"
path = "src/main.rs"

[dependencies]
seaki-dto = { path = "../seaki-dto" }
sha2.workspace = true

