[package]
name = "seaki-pipe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pipeline composition and dry-run execution"
repository = "https://github.com/normanpong/seaki"
readme = "../../README.md"
keywords = ["seaki", "wiki", "local-first"]
categories = ["development-tools"]

[lib]
path = "src/lib.rs"

[dependencies]
seaki-dto = { path = "../seaki-dto" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

