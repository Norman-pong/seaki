[package]
name = "seaki-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Memory and session management for Seaki"
repository = "https://github.com/normanpong/seaki"
readme = "../../README.md"
keywords = ["seaki", "wiki", "local-first"]
categories = ["development-tools"]

[lib]
path = "src/lib.rs"

[dependencies]
seaki-index = { path = "../seaki-index" }
regex = "1"
sha2 = { workspace = true }
tracing = "0.1"

[dev-dependencies]
tempfile.workspace = true

