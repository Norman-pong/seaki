[workspace]
members = [
    "crates/seaki-core",
    "crates/seaki-daemon",
    "crates/seaki-dto",
    "crates/seaki-dto-codegen",
    "crates/seaki-index",
    "crates/seaki-policy",
    "crates/seaki-sandbox",
    "crates/seaki-wiki",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
